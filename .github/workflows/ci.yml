# Builds the plugin, runs the TestKit suite and validates the plugin metadata on
# every pull request and on every push to main, and checks that the plugin still
# loads in a Gradle build running on JDK 17. Releases are handled separately by
# tag-validation.yml and publish.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running build; builds of
# main always run to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The build derives its version from git tags.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Also validates the checksum of the committed gradle-wrapper.jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` runs `check`, which covers the tests and `validatePlugins`.
      - name: Build, test and validate the plugin
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

  # The git hooks and code stats run through the shell Git ships, so run the
  # tests where that differs most: macOS (bash 3.2, a BSD userland) and
  # Windows (Git for Windows' bash). The build job covers Linux.
  test-other-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the tests
        shell: bash
        run: ./gradlew test --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: build/reports/tests/
          retention-days: 7

  # The code stats scripts: ShellCheck, and the POSIX router parsed by shells
  # that are not bash pretending, since a bashism there only shows up on
  # someone else's machine.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/main/resources/dev/coretide/plugin/armor/codestats
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dash and busybox
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dash busybox

      # Pinned: the version a distribution ships changes which checks fire.
      - name: Install ShellCheck
        run: |
          version=v0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${version}/shellcheck-${version}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install -m 755 "/tmp/shellcheck-${version}/shellcheck" /usr/local/bin/shellcheck

      - name: Lint
        run: |
          shellcheck -s sh _router
          shellcheck -s bash codestats.sh

      - name: Parse the router under dash and busybox
        run: |
          dash -n _router
          busybox sh -n _router

  # The plugin is built with JDK 21 but compiled for Java 17. Prove that the
  # oldest supported setup, Gradle 9.0 running on JDK 17, can resolve it from a
  # repository and apply it. That also checks the Java version the published
  # metadata advertises. The build job already covers the wrapper's Gradle on JDK 21.
  jdk17-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The last version listed becomes the default JAVA_HOME; both are exported
      # as JAVA_HOME_<version>_X64.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      # The wrapper still builds and publishes the plugin; `gradle` on the PATH is
      # the oldest supported version, used for the consumer build.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Publish the plugin to Maven local
        run: ./gradlew publishToMavenLocal --stacktrace

      - name: Apply it in a Gradle 9.0 build running on JDK 17
        run: |
          version="$(./gradlew -q properties | sed -n 's/^version: //p')"
          gradle -p compat/jdk17-consumer \
            -Dorg.gradle.java.home="$JAVA_HOME_17_X64" \
            -ParmorVersion="$version" \
            verifyJdk17 logExclusionInfo --stacktrace
